name: 发布正式版本

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: 解析发布版本
    runs-on: ubuntu-24.04
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
    steps:
      # 触发规则已限定 v 开头标签；标签指向哪个分支不再影响构建，因此这里不需要检出代码或比较 main。
      - name: 解析发布版本
        id: version
        shell: bash
        run: |
          set -Eeuo pipefail
          app_version="${GITHUB_REF_NAME#v}"
          if [ -z "$app_version" ]; then
            echo "标签必须包含 v 前缀后的版本号：$GITHUB_REF_NAME" >&2
            exit 1
          fi
          echo "app_version=$app_version" >> "$GITHUB_OUTPUT"

  desktop:
    name: 构建桌面端安装包
    needs: prepare
    uses: ./.github/workflows/desktop-cd.yml
    with:
      app_version: ${{ needs.prepare.outputs.app_version }}
    secrets: inherit

  docker:
    name: 构建 Docker 镜像
    needs: prepare
    uses: ./.github/workflows/docker-publish.yml
    with:
      app_version: ${{ needs.prepare.outputs.app_version }}
    secrets: inherit

  publish:
    name: 审批并发布正式版本
    needs:
      - prepare
      - desktop
      - docker
    runs-on: ubuntu-24.04
    concurrency:
      group: production-release-publish
      cancel-in-progress: false
    environment:
      name: production-release
    steps:
      - name: 检出正式版本代码
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 下载全部构建产物
        uses: actions/download-artifact@v8
        with:
          pattern: ydisks-*
          path: dist/artifacts
          merge-multiple: true

      - name: 校验发布产物并生成校验和
        shell: bash
        env:
          APP_VERSION: ${{ needs.prepare.outputs.app_version }}
        run: |
          set -Eeuo pipefail
          mkdir -p dist/release dist/digests

          echo "下载后的构建产物："
          find dist/artifacts -maxdepth 2 -type f -printf '%P\n' | sort

          expected_release_files=(
            "ydisks-xianyu-helper-linux-amd64-$APP_VERSION.tar.gz"
            "ydisks-xianyu-helper-linux-arm64-$APP_VERSION.tar.gz"
            "Ydisks-Xianyu-Helper-Setup.exe"
            "Ydisks-Xianyu-Helper-$APP_VERSION-arm64.pkg"
            "Ydisks-Xianyu-Helper-$APP_VERSION-amd64.pkg"
            "ydisks-xianyu-helper-docker-linux-amd64-$APP_VERSION.tar.gz"
            "ydisks-xianyu-helper-docker-linux-arm64-$APP_VERSION.tar.gz"
          )
          for release_file in "${expected_release_files[@]}"; do
            source_file="dist/artifacts/$release_file"
            if [ ! -f "$source_file" ]; then
              echo "缺少正式发布产物：$release_file" >&2
              exit 1
            fi
            cp -- "$source_file" dist/release/
          done

          digest_count=0
          while IFS= read -r artifact_file; do
            artifact_name="$(basename "$artifact_file")"
            if [[ "$artifact_name" =~ ^[0-9a-f]{64}$ ]]; then
              cp -- "$artifact_file" dist/digests/
              digest_count=$((digest_count + 1))
            fi
          done < <(find dist/artifacts -maxdepth 2 -type f -print)
          if [ "$digest_count" -ne 2 ]; then
            echo "Docker 镜像摘要数量错误：预期 2 个，实际 $digest_count 个。" >&2
            exit 1
          fi

          echo "准备发布的产物："
          find dist/release -maxdepth 1 -type f -printf '%f\n' | sort
          echo "准备发布的 Docker 摘要："
          find dist/digests -maxdepth 1 -type f -printf '%f\n' | sort
          (cd dist/release && sha256sum * > SHA256SUMS)

      - name: 配置 Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 审批后再次校验标签提交
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin --tags --force
          bash tools/release/check-version.sh "$GITHUB_REF_NAME" "$GITHUB_SHA"

      - name: 发布正式 Docker manifest
        shell: bash
        env:
          APP_VERSION: ${{ needs.prepare.outputs.app_version }}
        run: |
          set -Eeuo pipefail
          image_name="ghcr.io/${GITHUB_REPOSITORY,,}"
          digest_args=()
          while IFS= read -r digest_file; do
            digest_args+=("$image_name@sha256:$(basename "$digest_file")")
          done < <(find dist/digests -maxdepth 1 -type f -print | sort)

          # 任意 v 开头标签都发布标签本身和完整提交 sha 标签。
          refs=("$image_name:$GITHUB_REF_NAME" "$image_name:sha-$GITHUB_SHA")
          # 只有 1.2.3 形状的正式版本才额外发布版本号、次版本和 latest，
          # 避免临时标签把 compose.yml 默认使用的 latest 推给生产部署。
          if [[ "$APP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            refs+=(
              "$image_name:$APP_VERSION"
              "$image_name:${APP_VERSION%.*}"
              "$image_name:latest"
            )
          fi
          tag_args=()
          for ref in "${refs[@]}"; do
            tag_args+=(--tag "$ref")
          done
          docker buildx imagetools create "${tag_args[@]}" "${digest_args[@]}"
          for ref in "${refs[@]}"; do
            docker buildx imagetools inspect "$ref"
          done

      - name: 创建或更新 GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ needs.prepare.outputs.app_version }}
        run: |
          set -Eeuo pipefail
          release_notes_file="dist/release-notes.md"
          git log -1 --format='提交：%h%n%n%B' "$GITHUB_REF_NAME" > "$release_notes_file"
          if [ ! -s "$release_notes_file" ]; then
            printf '%s\n' '本版本提交未提供 release notes。' > "$release_notes_file"
          fi
          mapfile -t release_files < <(find dist/release -maxdepth 1 -type f -print | sort)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" \
              --title "Ydisks 闲鱼助手 $APP_VERSION" \
              --notes-file "$release_notes_file"
            gh release upload "$GITHUB_REF_NAME" "${release_files[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${release_files[@]}" \
              --verify-tag \
              --notes-file "$release_notes_file" \
              --title "Ydisks 闲鱼助手 $APP_VERSION"
          fi
